<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Wellness · Huddle7</title>
<style>
:root{
  --bg:#070b12; --bg-2:#0b121e; --surface:#101a2a; --surface-2:#142136; --surface-3:#1a2a44;
  --border:#263650; --border-soft:rgba(38,52,77,.68);
  --text:#eef4fc; --muted:#9aaac1; --muted-2:#71839b;
  --accent:#ff7a1a; --accent-2:#ff4a3d; --accent-soft:rgba(255,122,26,.13);
  --green:#2fd07a; --blue:#6ea8fe; --violet:#a78bfa; --red:#ff4a3d; --yellow:#ffc53d;
  --radius:14px; --shadow:0 18px 44px rgba(0,0,0,.3);
  font-family:"Segoe UI",Inter,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(1200px 620px at 42% -10%, rgba(34,57,87,.30), transparent 70%), var(--bg);
  color:var(--text); font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
::selection{background:rgba(255,122,26,.32)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2b3d58;border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a5175}

/* ---------- Cabecera ---------- */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:20px;height:64px;
  padding:0 22px;border-bottom:1px solid var(--border-soft);
  background:rgba(7,11,18,.84);backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:11px;min-width:238px}
.brand-mark{
  width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;
  font-size:14px;font-weight:900;color:#ffd6b6;
  border:1px solid rgba(255,122,26,.45);
  background:linear-gradient(145deg,rgba(255,122,26,.28),rgba(255,74,61,.14));
  box-shadow:0 8px 18px rgba(255,74,61,.14), inset 0 1px 0 rgba(255,255,255,.09);
}
.brand-title{font-size:14px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brand-title span{color:var(--accent);font-weight:700}
.brand-sub{font-size:10.5px;color:var(--muted-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:238px}
.tabs{display:flex;gap:3px;padding:4px;border-radius:11px;border:1px solid var(--border-soft);background:rgba(16,26,42,.55)}
.tab{
  border:0;background:transparent;border-radius:8px;padding:7px 13px;font-size:11.5px;font-weight:700;
  color:var(--muted);transition:background .15s,color .15s,box-shadow .15s;white-space:nowrap;
}
.tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tab.is-active{background:var(--accent-soft);color:#ffb27a;box-shadow:inset 0 0 0 1px rgba(255,122,26,.35)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;
  border:1px solid var(--border);background:rgba(16,26,42,.7);font-size:10px;font-weight:700;color:var(--muted);
  white-space:nowrap;
}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}
.chip.is-demo .dot{background:var(--accent);box-shadow:0 0 8px rgba(255,122,26,.8)}
.chip.is-live .dot{background:var(--green);box-shadow:0 0 8px rgba(47,208,122,.8)}
.chip.is-file .dot{background:var(--blue);box-shadow:0 0 8px rgba(110,168,254,.8)}
.updated{font-size:10.5px;color:var(--muted-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Botones y controles ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 11px;border-radius:9px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  font-size:11px;font-weight:700;transition:border-color .15s,background .15s,transform .05s;white-space:nowrap;
}
.btn svg{width:13px;height:13px;flex:none}
.btn:hover{border-color:rgba(255,122,26,.5);background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{
  border-color:transparent;background:linear-gradient(135deg,#ff8a2e,#ff5a2e);color:#1b0b02;
  box-shadow:0 8px 18px rgba(255,90,46,.24);
}
.btn-primary:hover{background:linear-gradient(135deg,#ff9844,#ff6a3c);border-color:transparent}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 9px;font-size:10.5px;border-radius:8px}
.btn.is-loading svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:9px;border:1px solid var(--border-soft);background:rgba(16,26,42,.8)}
.seg button{
  border:0;background:transparent;border-radius:7px;padding:5px 10px;font-size:10.5px;font-weight:700;color:var(--muted);
  transition:background .15s,color .15s;
}
.seg button:hover{color:var(--text)}
.seg button.is-active{background:var(--surface-3);color:var(--text)}
.input{
  width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--border);
  background:rgba(9,15,26,.78);font-size:11.5px;outline:none;transition:border-color .15s;
}
.input:focus{border-color:rgba(255,122,26,.55)}
.input::placeholder{color:var(--muted-2)}
.select{
  padding:5px 7px;border-radius:7px;border:1px solid var(--border);background:rgba(9,15,26,.82);
  font-size:10.5px;outline:none;max-width:100%;
}
.select:focus{border-color:rgba(255,122,26,.55)}
input[type="number"].input{width:76px}
.check{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--accent);width:14px;height:14px}

/* ---------- Estructura ---------- */
.wrap{max-width:1560px;margin:0 auto;padding:22px 26px 56px}
.page{animation:fadeUp .22s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:20px;font-weight:800;letter-spacing:-.015em;margin:0}
.page-head p{margin:4px 0 0;font-size:11.5px;color:var(--muted)}
.eyebrow{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:6px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-2-heavy{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.mt-14{margin-top:14px}
.mb-14{margin-bottom:14px}

/* ---------- Tarjetas ---------- */
.card{
  background:linear-gradient(180deg,rgba(18,30,49,.92),rgba(12,20,35,.95));
  border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px 17px;min-width:0;
}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-head h3{margin:0;font-size:12.5px;font-weight:800;letter-spacing:.005em}
.card-head .hint{font-size:10px;color:var(--muted-2);margin-top:2px}
.card-head .side{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.card-head .side .seg button{padding:4px 8px;font-size:10px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{
  position:relative;overflow:hidden;min-width:0;padding:14px 15px;border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(20,33,54,.92),rgba(13,22,38,.94));
  border:1px solid var(--border-soft);
}
.kpi::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent 72%);opacity:.5}
.kpi .label{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-2);font-weight:800}
.kpi .value{font-size:25px;font-weight:800;line-height:1.15;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .value small{font-size:12px;font-weight:600;color:var(--muted)}
.kpi .sub{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:5px}
.delta{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;white-space:nowrap}
.delta.bad{color:#ffb4ae;background:rgba(255,74,61,.14)}
.delta.good{color:#9ff0c1;background:rgba(47,208,122,.13)}
.delta.flat{color:var(--muted);background:rgba(154,170,193,.1)}
.progress{height:5px;border-radius:4px;background:rgba(255,255,255,.06);margin-top:8px;overflow:hidden}
.progress i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ffb15e,var(--accent))}

/* ---------- Gráficas ---------- */
.chart{width:100%;min-height:190px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart-empty{display:grid;place-items:center;min-height:190px;color:var(--muted-2);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:10px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .dash{display:inline-block;width:14px;height:0;border-top:1px dashed var(--muted-2);margin-right:5px;vertical-align:3px}

/* ---------- Parte del día ---------- */
.alerts{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 12px}
.alert-chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;font-size:10.5px;font-weight:700;
  border:1px solid rgba(255,74,61,.35);background:rgba(255,74,61,.1);color:#ffc1bb;cursor:pointer;
}
.alert-chip:hover{border-color:rgba(255,74,61,.7)}
.alert-chip.period{border-color:rgba(167,139,250,.42);background:rgba(167,139,250,.1);color:#d6c9ff}
.alert-chip.sleep{border-color:rgba(110,168,254,.4);background:rgba(110,168,254,.1);color:#c3dbff}
.alert-chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.alerts-empty{font-size:11px;color:var(--muted-2);padding:2px 0 10px}

/* ---------- Tablas ---------- */
.table-wrap{overflow:auto;border-radius:10px;border:1px solid rgba(38,52,77,.5)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
thead th{
  position:sticky;top:0;z-index:2;background:#122035;text-align:left;white-space:nowrap;
  font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-2);font-weight:800;
  padding:9px 11px;border-bottom:1px solid var(--border-soft);
}
tbody td{padding:8px 11px;border-bottom:1px solid rgba(38,52,77,.34);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.025)}
tr.clickable{cursor:pointer}
.name-cell{display:flex;align-items:center;gap:9px;font-weight:700;white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted-2)}
.pill{
  display:inline-flex;align-items:center;justify-content:center;min-width:28px;padding:3px 8px;border-radius:7px;
  font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums;
}
.pill-period{background:rgba(167,139,250,.18);color:#d8ccff}
.tag{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--muted)}
.tag-yes{background:rgba(255,74,61,.16);color:#ffb4ae}
.tag-no{background:rgba(255,255,255,.05);color:var(--muted-2)}
.tag-period{background:rgba(167,139,250,.18);color:#d8ccff}
.days-cell{display:flex;gap:3px;flex-wrap:wrap}
.day-dot{width:9px;height:9px;border-radius:3px;background:rgba(255,255,255,.07)}
.day-dot.on{background:var(--violet)}

/* ---------- Mapa diario ---------- */
.hm-wrap{overflow-x:auto;overflow-y:hidden;padding-bottom:6px}
.hm{display:grid;gap:3px;grid-auto-rows:27px;min-width:max-content;align-items:stretch}
.hm-name{
  position:sticky;left:0;z-index:3;display:flex;align-items:center;padding:0 9px 0 2px;
  font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:#0d1829;box-shadow:8px 0 12px rgba(0,0,0,.28);border-radius:5px;
}
.hm-corner{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);font-weight:800;background:transparent;box-shadow:none;z-index:4}
.hm-month{
  display:flex;align-items:center;justify-content:flex-start;padding-left:4px;
  font-size:8.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);
  border-left:1px solid rgba(255,255,255,.06);overflow:hidden;white-space:nowrap;
}
.hm-date{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--muted-2);background:transparent}
.hm-date b{font-size:9px;font-weight:800;color:var(--muted);line-height:1.1}
.hm-date span{font-size:7.5px;line-height:1.1;color:var(--muted-2)}
.hm-date.is-today b{color:var(--accent)}
.hm-date.is-today{background:rgba(255,122,26,.07);border-radius:5px}
.hm-cell{
  border-radius:5px;display:grid;place-items:center;font-size:9.5px;font-weight:800;
  color:rgba(255,255,255,.95);cursor:pointer;transition:filter .12s;
}
.hm-cell:hover{filter:brightness(1.25)}
.hm-cell.is-empty{background:rgba(255,255,255,.03);cursor:default}
.hm-cell.is-empty:hover{filter:none}
.hm-cell.is-today{box-shadow:inset 0 0 0 1px rgba(255,122,26,.5)}
.hm-cell .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.scale{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:9.5px;color:var(--muted-2)}
.scale .bar{height:8px;width:164px;border-radius:5px;border:1px solid rgba(255,255,255,.06)}
.scale .bar.fatigue{background:linear-gradient(90deg,rgb(22,58,42),rgb(35,110,74),rgb(166,133,44),rgb(226,111,36),rgb(223,65,58),rgb(214,38,72))}
.scale .bar.sleep{background:linear-gradient(90deg,rgb(214,38,72),rgb(226,111,36),rgb(176,141,44),rgb(74,160,104),rgb(47,208,122))}

/* ---------- Jugadoras ---------- */
.jugadoras-layout{display:grid;grid-template-columns:296px minmax(0,1fr);gap:14px;align-items:start}
.player-list-card{padding:12px}
.player-search{position:relative;margin-bottom:8px}
.player-search svg{position:absolute;left:9px;top:9px;width:12px;height:12px;color:var(--muted-2)}
.player-search .input{padding-left:26px;font-size:11px}
.player-list{max-height:calc(100vh - 268px);overflow:auto;padding-right:2px}
.player-item{
  display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:9px;align-items:center;
  padding:8px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:background .14s,border-color .14s;
}
.player-item:hover{background:rgba(255,255,255,.035)}
.player-item.is-active{border-color:rgba(255,122,26,.4);background:var(--accent-soft)}
.player-item .pn{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-item .ps{font-size:9.5px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-item .spark{flex:none;opacity:.9}
.avatar{
  width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-size:10.5px;font-weight:900;color:#ffd9bd;letter-spacing:.02em;
  background:linear-gradient(145deg,rgba(255,122,26,.35),rgba(255,74,61,.18));
  border:1px solid rgba(255,122,26,.35);
}
.avatar.lg{width:46px;height:46px;font-size:14px;border-radius:15px}
.detail-head{display:flex;align-items:center;gap:13px;margin-bottom:14px;flex-wrap:wrap}
.detail-head h2{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
.detail-head .sub{font-size:10.5px;color:var(--muted-2);margin-top:2px}
.detail-head .side{margin-left:auto;display:flex;align-items:center;gap:8px}
.mini-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.mini-kpi{padding:11px 12px;border-radius:11px;border:1px solid var(--border-soft);background:rgba(20,33,54,.55);min-width:0}
.mini-kpi .label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-kpi .value{font-size:18px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.mini-kpi .value small{font-size:10px;color:var(--muted);font-weight:600}
.mini-kpi .sub{font-size:9.5px;color:var(--muted-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.event-list li{display:flex;gap:10px;align-items:flex-start;font-size:11px;padding-bottom:8px;border-bottom:1px solid rgba(38,52,77,.34)}
.event-list li:last-child{border-bottom:0;padding-bottom:0}
.event-list .date{flex:none;width:64px;color:var(--muted-2);font-size:10px;padding-top:1px}
.event-list .txt{color:var(--text)}
.cycle-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.cycle-stat{padding:10px 12px;border-radius:10px;border:1px solid var(--border-soft);background:rgba(167,139,250,.06)}
.cycle-stat .label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);font-weight:800}
.cycle-stat .value{font-size:16px;font-weight:800;margin-top:3px}
.cycle-stat .value small{font-size:9.5px;color:var(--muted);font-weight:600}
.nota{font-size:10px;color:var(--muted-2);margin:10px 0 0;line-height:1.5}

/* ---------- Calendario del ciclo menstrual ---------- */
.calendar-wrap{display:grid;grid-template-columns:minmax(250px,360px) minmax(0,1fr);gap:20px;align-items:start}
.calendar{display:flex;flex-direction:column;gap:5px}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);margin-bottom:2px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-day{
  position:relative;aspect-ratio:1/1;border-radius:8px;border:1px solid rgba(38,52,77,.4);
  background:rgba(9,15,26,.35);display:flex;justify-content:center;padding-top:5px;
  font-size:10.5px;font-weight:600;color:var(--muted-2);font-variant-numeric:tabular-nums;
  transition:background .12s,border-color .12s;
}
.cal-day.has-data{color:var(--text);background:rgba(20,33,54,.7)}
.cal-day.is-empty{background:transparent;border-color:transparent}
.cal-day.is-today{box-shadow:inset 0 0 0 1px rgba(255,122,26,.6)}
.cal-day.is-period{background:rgba(255,74,61,.12);border-color:rgba(255,74,61,.3);color:#ffd3ce}
.cal-day:hover{border-color:rgba(255,122,26,.45)}
.cal-dot{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#ff4a3d;box-shadow:0 0 8px rgba(255,74,61,.75)}
.calendar-side{min-width:0}
.calendar-side .cycle-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.calendar-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:10px;color:var(--muted);margin-top:12px}
.calendar-legend .k{display:inline-flex;align-items:center;gap:6px}
.calendar-legend .dot-red{width:8px;height:8px;border-radius:50%;background:#ff4a3d;box-shadow:0 0 6px rgba(255,74,61,.7)}
.calendar-legend .dot-today{width:9px;height:9px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,122,26,.7)}

/* ---------- Datos / conexión ---------- */
.source-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.source-option{
  display:block;width:100%;text-align:left;padding:12px;border-radius:11px;border:1px solid var(--border);
  background:rgba(16,26,42,.5);transition:border-color .15s,background .15s;
}
.source-option:hover{border-color:rgba(255,122,26,.35)}
.source-option.is-active{border-color:rgba(255,122,26,.5);background:var(--accent-soft)}
.source-option .t{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800}
.source-option .t svg{width:13px;height:13px;color:var(--accent)}

<script>
'use strict';
/* =========================================================================
   Wellness · Huddle7 — panel independiente de seguimiento diario
   Datos 100% locales: demo, CSV o Google Sheets (Apps Script / CSV publicado)
   ========================================================================= */

/* ------------------------------ Utilidades ------------------------------ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2,'0');
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONTHS_FULL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const WD = ['D','L','M','X','J','V','S'];
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function parseISO(s){ const p=String(s).split('-').map(Number); return new Date(p[0],(p[1]||1)-1,p[2]||1); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function todayISO(){ return iso(new Date()); }
function fmtDay(s, opts={}){
  if(!s) return '—';
  const d = parseISO(s);
  const wd = opts.wd===false ? '' : WD[d.getDay()]+' ';
  const yr = opts.yr ? ' '+d.getFullYear() : '';
  return `${wd}${d.getDate()} ${MONTHS[d.getMonth()]}${yr}`;
}
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num1(v){ return (v==null || Number.isNaN(v)) ? '—' : String(Math.round(v*10)/10).replace('.',','); }
function numDec(v){ return (v==null || Number.isNaN(v)) ? '—' : v.toFixed(1).replace('.',','); }
function pct(v){ return (v==null || Number.isNaN(v)) ? '—' : Math.round(v*100)+'%'; }
function clamp(v,a,b){ return Math.min(b,Math.max(a,v)); }
function mean(arr){ const xs=(arr||[]).filter(v=>typeof v==='number'&&!Number.isNaN(v)); return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null; }
function uniq(arr){ return Array.from(new Set(arr)); }
function norm(s){ return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function slug(s){ return norm(s).replace(/\s+/g,'-') || 'jugadora'; }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function xLabelIndices(n, target=7){
  if(n<=0) return [];
  const every = Math.max(1, Math.ceil(n/target));
  const idx = [];
  for(let i=0;i<n;i+=every) idx.push(i);
  const last = idx[idx.length-1];
  if(last !== n-1){
    if((n-1) - last < every*0.6) idx[idx.length-1] = n-1;
    else idx.push(n-1);
  }
  return idx;
}
function titleName(s){
  const t = String(s??'').trim().replace(/\s+/g,' ');
  if(!t) return '';
  if(t !== t.toLowerCase()) return t;
  const small = new Set(['de','del','la','las','los','y','e']);
  return t.split(' ').map((w,i)=> (small.has(w)&&i>0) ? w : w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}
function initials(name){ const p=String(name||'').trim().split(/\s+/); return (((p[0]||'')[0]||'')+((p[1]||'')[0]||'')).toUpperCase() || '?'; }
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function timeLabel(ms){ if(!ms) return '—'; const d=new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function downloadBlob(filename, content, type){
  const blob = new Blob([content], {type: type || 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{
      const ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      return true;
    }catch(_){ return false; }
  }
}

/* Enlace para compartir el panel con el equipo técnico.
   Codifica la URL privada de la fuente de datos en el propio enlace. */
function encodeFuente(url){
  const bytes = new TextEncoder().encode(String(url));
  let bin = '';
  bytes.forEach(b=>{ bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeFuente(value){
  const b64 = String(value).replace(/-/g,'+').replace(/_/g,'/');
  const padded = b64 + '==='.slice((b64.length+3)%4);
  const bin = atob(padded);
  const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function buildShareLink(){
  const base = location.href.split('#')[0].split('?')[0];
  const params = new URLSearchParams();
  if(state.sourceUrl) params.set('fuente', encodeFuente(state.sourceUrl));
  const team = state.teamName || teamLabel();
  if(team) params.set('equipo', team);
  const qs = params.toString();
  return base + (qs ? '?' + qs : '') + '#equipo';
}

/* ---------------------------- Escalas de color --------------------------- */
function rgbStr(rgb){ return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`; }
function rgbaStr(rgb,a){ return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`; }
function stopColor(value, stops){
  if(value <= stops[0][0]) return stops[0][1];
  for(let i=1;i<stops.length;i++){
    const [v1,c1] = stops[i-1];
    const [v2,c2] = stops[i];
    if(value <= v2){
      const t = (value-v1)/((v2-v1)||1);
      return [Math.round(c1[0]+(c2[0]-c1[0])*t), Math.round(c1[1]+(c2[1]-c1[1])*t), Math.round(c1[2]+(c2[2]-c1[2])*t)];
    }
  }
  return stops[stops.length-1][1];
}
const FATIGUE_STOPS = [[1,[22,58,42]],[3,[35,110,74]],[5,[166,133,44]],[7,[226,111,36]],[9,[223,65,58]],[10,[214,38,72]]];
const SLEEP_STOPS   = [[1,[214,38,72]],[2,[226,111,36]],[3,[176,141,44]],[4,[74,160,104]],[5,[47,208,122]]];
function fatigueRgb(v){ return stopColor(v==null?0:v, FATIGUE_STOPS); }
function fatigueColor(v){ return rgbStr(fatigueRgb(v)); }
function sleepRgb(v){ return stopColor(v==null?0:v, SLEEP_STOPS); }
function sleepColor(v){ return rgbStr(sleepRgb(v)); }
function sleepLabel(v){ return ['','Muy mala','Mala','Regular','Buena','Muy buena'][v] || ''; }
const ACCENT_RGB=[255,122,26], BLUE_RGB=[110,168,254], VIOLET_RGB=[167,139,250], RED_RGB=[255,74,61], GREEN_RGB=[47,208,122], MUTED_RGB=[154,170,193];
function pillFatigue(v){
  if(v==null) return '<span class="muted">—</span>';
  const rgb = fatigueRgb(v);
  return `<span class="pill" style="background:${rgbaStr(rgb,.22)};color:${rgbStr(rgb)};filter:brightness(1.5)">${v}</span>`;
}
function pillSleep(v){
  if(v==null) return '<span class="muted">—</span>';
  const rgb = sleepRgb(v);
  return `<span class="pill" style="background:${rgbaStr(rgb,.22)};color:${rgbStr(rgb)};filter:brightness(1.5)">${v}</span>`;
}

/* ------------------------------ Datos de demo --------------------------- */
const DEMO_PLAYERS = [
  {name:'Lucía Ferrer',     fatigueBase:6.2, sleepBase:3.3, disRate:.10, story:'fatigue'},
  {name:'Marta Sanz',       fatigueBase:4.4, sleepBase:3.8, disRate:.05},
  {name:'Paula Ortiz',      fatigueBase:5.1, sleepBase:3.5, disRate:.05},
  {name:'Alba Ruiz',        fatigueBase:4.7, sleepBase:3.2, disRate:.30, story:'knee'},
  {name:'Nerea Vidal',      fatigueBase:3.9, sleepBase:3.6, disRate:.04, story:'period'},
  {name:'Carla Domínguez',  fatigueBase:4.6, sleepBase:3.5, disRate:.05, story:'sleep'},
  {name:'Irene Castro',     fatigueBase:3.2, sleepBase:3.9, disRate:.03},
  {name:'Sofía Navarro',    fatigueBase:5.6, sleepBase:3.2, disRate:.08},
  {name:'Claudia Romero',   fatigueBase:4.1, sleepBase:3.7, disRate:.04},
  {name:'Marina Gil',       fatigueBase:5.0, sleepBase:3.4, disRate:.06},
  {name:'Andrea Torres',    fatigueBase:3.6, sleepBase:3.8, disRate:.03},
  {name:'Julia Benítez',    fatigueBase:4.9, sleepBase:3.1, disRate:.05},
  {name:'Elena Márquez',    fatigueBase:4.3, sleepBase:3.6, disRate:.04}
];
const DEMO_NOTES = ['Sobrecarga en cuádriceps','Dolor en rodilla derecha','Molestia en tobillo izquierdo','Carga en lumbares','Dolor en hombro derecho','Ampollas en el pie','Tirón en gemelo','Contusión en la cadera'];
function buildDemo(){
  const today = todayISO();
  const rand = mulberry32(20261126);
  const players = DEMO_PLAYERS.map((def,idx)=>{
    const cycleLen = 26 + Math.floor(rand()*7);
    const offset = idx===4 ? 2 : Math.floor(rand()*cycleLen);
    const ranges = [];
    let start = addDays(today, -offset);
    const first = addDays(today, -70);
    while(start >= first){
      ranges.push([start, addDays(start,4)]);
      start = addDays(start, -cycleLen);
    }
    return Object.assign({}, def, {id:slug(def.name), cycleLen, ranges});
  });
  const entries = [];
  for(let back=34; back>=0; back--){
    const date = addDays(today,-back);
    const dow = parseISO(date).getDay();
    if(dow===0) continue; // sin respuesta dominical
    players.forEach((p,idx)=>{
      if(back===0 && (idx===10 || idx===11 || idx===12)) return; // hoy responden 10 de 13
      if(back!==0 && rand() > 0.955) return;
      const load = {1:.9,2:.5,3:.1,4:.7,5:.5,6:-.3}[dow] || 0;
      let fatigue = p.fatigueBase + load + (rand()-.5)*1.7;
      let sleep = p.sleepBase + (rand()-.5)*1.2;
      let discomfort = 0, note = '';
      if(p.story==='fatigue' && back<=8) fatigue += 1.7;
      if(p.story==='sleep' && back<=7) sleep -= 1.1;
      if(p.story==='knee' && back<=10 && rand()<.55){ discomfort=1; note='Dolor en la rodilla derecha'; }
      else if(rand() < p.disRate){ discomfort=1; note=DEMO_NOTES[Math.floor(rand()*DEMO_NOTES.length)]; }
      if(back===0){
        if(p.story==='fatigue') fatigue = 9;
        if(p.story==='sleep') sleep = 2;
        if(p.story==='knee'){ discomfort = 1; note = 'Dolor en la rodilla derecha'; fatigue = Math.max(fatigue,6); }
      }
      const period = p.ranges.some(([a,b])=> date>=a && date<=b) ? 1 : 0;
      const hour = 7 + Math.floor(rand()*3);
      const minute = Math.floor(rand()*60);
      entries.push({
        playerName:p.name, playerId:p.id, date,
        timeMs:new Date(`${date}T${pad(hour)}:${pad(minute)}:00`).getTime(),
        fatigue:clamp(Math.round(fatigue),1,10), sleep:clamp(Math.round(sleep),1,5),
        discomfort, discomfortNote:discomfort?note:'', period
      });
    });
  }
  return entries;
}

/* --------------------------- Lectura de CSV ----------------------------- */
function detectDelimiter(text){
  const line = text.split(/\r?\n/).find(l=>l.trim()!=='') || '';
  const counts = {';':0, ',':0, '\t':0};
  let inQ = false;
  for(const ch of line){
    if(ch==='"'){ inQ = !inQ; continue; }
    if(inQ) continue;
    if(ch in counts) counts[ch]++;
  }
  if(counts['\t'] > counts[';'] && counts['\t'] >= counts[','] && counts['\t']>0) return '\t';
  return counts[';'] >= counts[','] ? ';' : ',';
}
function parseCSV(text){
  text = String(text||'').replace(/^\uFEFF/,'');
  const delim = detectDelimiter(text);
  const rows = [];
  let row = [], field = '', inQ = false, started = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQ = false;
      } else field += c;
      continue;
    }
    if(c === '"'){ inQ = true; started = true; continue; }
    if(c === delim){ row.push(field); field=''; started = true; continue; }
    if(c === '\r'){ continue; }
    if(c === '\n'){
      row.push(field); field='';
      if(row.some(v=>String(v).trim()!=='')) rows.push(row);
      row = []; started = false; continue;
    }
    field += c; started = true;
  }
  row.push(field);
  if(row.some(v=>String(v).trim()!=='')) rows.push(row);
  if(!rows.length) return {headers:[], rows:[]};
  return {headers:rows[0].map(h=>String(h).trim()), rows:rows.slice(1)};
}
const RE_ISO = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s](\d{1,2}):(\d{2})(?::(\d{2}))?)?/;
const RE_DMY = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[\s,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/;
function parseDateCell(value){
  const s = String(value==null?'':value).trim();
  if(!s) return null;
  let m = s.match(RE_ISO);
  if(m){
    const y=+m[1], mo=+m[2], d=+m[3];
    if(mo>=1 && mo<=12 && d>=1 && d<=31){
      const dt = new Date(y, mo-1, d, +(m[4]||0), +(m[5]||0), +(m[6]||0));
      if(!Number.isNaN(dt.getTime())) return {date:iso(dt), timeMs:dt.getTime()};
    }
  }
  m = s.match(RE_DMY);
  if(m){
    let a=+m[1], b=+m[2], y=+m[3];
    if(y<100) y += 2000;
    let day=a, month=b;
    if(a<=12 && b>12){ day=b; month=a; }
    const dt = new Date(y, month-1, day, +(m[4]||0), +(m[5]||0), +(m[6]||0));
    if(!Number.isNaN(dt.getTime())) return {date:iso(dt), timeMs:dt.getTime()};
  }
  return null;
}
function parseScore(value, min, max){
  const m = String(value==null?'':value).match(/(\d+(?:[.,]\d+)?)/);
  if(!m) return null;
  const n = parseFloat(m[1].replace(',','.'));
  if(Number.isNaN(n) || n < min-0.4 || n > max+0.4) return null;
  return clamp(Math.round(n), min, max);
}
function parseSleep(value){
  const n = parseScore(value,1,5);
  if(n!=null) return n;
  const t = norm(value);
  if(!t) return null;
  if(/muy buena|excelente|muy bien/.test(t)) return 5;
  if(/buena|bien/.test(t)) return 4;
  if(/regular|normal/.test(t)) return 3;
  if(/muy mala|fatal|malisima/.test(t)) return 1;
  if(/mala|mal\b/.test(t)) return 2;
  return null;
}
function parseYesNo(value){
  const s = norm(value);
  if(!s) return null;
  if(/^(si|s|yes|y|1|true|verdadero|x|correcto)$/.test(s)) return 1;
  if(/^(no|n|0|false|falso)$/.test(s)) return 0;
  if(/^si\b/.test(s)) return 1;
  if(/^no\b/.test(s)) return 0;
  return null;
}
function extraFromYes(value){
  const s = String(value==null?'':value).trim();
  const m = s.match(/^s[ií]\s*[,;:.\-–]?\s*(.+)$/i);
  return m ? m[1].trim() : '';
}
/* Molestias: acepta Sí/No, "ninguna", y también texto libre ("piernas, y espalda",
   "En la rodilla derecha"...), que se cuenta como molestia y se guarda como detalle. */
function parseDiscomfort(value){
  const raw = String(value==null?'':value).trim();
  const s = norm(raw);
  if(!s) return {flag:null, note:''};
  if(/^(no|ninguna|ninguno|nada|sin molestias|sin dolor|sin problemas|todo bien|perfecto|normal|no tengo|no hay)\b/.test(s)) return {flag:0, note:''};
  if(/^si\b/.test(s)) return {flag:1, note:extraFromYes(raw)};
  if(/^(0|false)$/.test(s)) return {flag:0, note:''};
  if(/^(1|true)$/.test(s)) return {flag:1, note:''};
  return {flag:1, note:raw};
}
const FIELD_KEYS = ['timestamp','player','fatigue','discomfort','note','sleep','period'];
const FIELD_LABELS = {ignore:'Ignorar', timestamp:'Fecha / hora', player:'Jugadora', fatigue:'Fatiga física', discomfort:'Molestias', note:'Detalle de molestia', sleep:'Calidad del sueño', period:'Regla'};
const FIELD_EXACT = [
  ['timestamp', ['marca temporal','marca de tiempo','fecha y hora','fecha de envio','fecha de envio del formulario','timestamp','fecha']],
  ['player', ['nombre y apellidos','nombre completo','nombre jugadora','nombre de la jugadora','jugadora','nombre','deportista','quien eres']],
  ['note', ['detalle de la molestia','detalle molestia','detalle','que molestia','descripcion de la molestia','descripcion molestia','explica la molestia','describe la molestia','observaciones','notas','comentario','cual']],
  ['fatigue', ['fatiga fisica','fatiga fisica 1 10','fatiga','nivel de fatiga','cansancio','fatiga muscular']],
  ['sleep', ['calidad del sueno','calidad de sueno','calidad sueno','calidad del sueno 1 5','sueno','calidad del descanso','descanso']],
  ['discomfort', ['tienes alguna molestia','alguna molestia','tienes molestias','molestias','molestia','tienes algun dolor','dolor']],
  ['period', ['tienes la regla','estas con la regla','tienes el periodo','menstruacion','regla','periodo']]
];
function detectField(header){
  const n = norm(header);
  if(!n) return null;
  for(const [field, list] of FIELD_EXACT) if(list.includes(n)) return field;
  if(/marca temporal|marca de tiempo|fecha|hora|timestamp/.test(n)) return 'timestamp';
  if(/nombre|jugadora|deportista|quien/.test(n)) return 'player';
  if(/regla|menstrua|periodo/.test(n)) return 'period';
  if(/detalle|describe|descripcion|observ|nota|comentario|explica/.test(n)) return 'note';
  if(/molest|dolor/.test(n)) return 'discomfort';
  // La fatiga se comprueba antes que el sueño: hay formularios que mencionan el sueño
  // dentro de la pregunta de fatiga ("no relacionado con el sueño").
  if(/fatig|cansad|cansancio|fisic|entrenamiento|partido|esfuerzo|recupera|energia/.test(n)) return 'fatigue';
  if(/suen|descans|dormid|dormir/.test(n)) return 'sleep';
  return null;
}
function autoMap(headers, rows){
  const mapping = headers.map(()=>null);
  // Cada campo puede tener varias columnas candidatas: nos quedamos con la más completa.
  const candidates = {};
  headers.forEach((h,i)=>{
    const f = detectField(h);
    if(f){ (candidates[f] = candidates[f] || []).push(i); }
  });
  Object.keys(candidates).forEach(field=>{
    let best = -1, bestScore = -1;
    candidates[field].forEach(i=>{
      const values = rows.slice(0, 200).map(r=>String((r||[])[i]==null?'':(r||[])[i]).trim()).filter(Boolean);
      const score = values.length;
      if(score > bestScore){ bestScore = score; best = i; }
    });
    if(best >= 0) mapping[best] = field;
  });
  if(!mapping.includes('timestamp') && rows && rows.length){
    for(let i=0;i<headers.length;i++){
      if(mapping[i]) continue;
      const sample = rows.slice(0,8).map(r=>r[i]).filter(v=>String(v==null?'':v).trim()!=='');
      if(sample.length && sample.filter(v=>parseDateCell(v)).length >= Math.ceil(sample.length*0.8)){ mapping[i]='timestamp'; break; }
    }
  }
  return mapping;
}
function signatureOf(headers){ return 'v2|' + norm(headers.join(' | ')).slice(0,140); }
function savedMappingFor(headers){
  const sig = signatureOf(headers);
  const saved = state.savedMappings[sig];
  return (Array.isArray(saved) && saved.length===headers.length) ? saved.slice() : null;
}
function requireColumns(mapping){ return mapping.includes('timestamp') && mapping.includes('player'); }

function buildPlayers(entries){
  const aliases = state.playerAliases || {};
  const map = new Map();
  for(const rawEntry of entries){
    const al = aliases[rawEntry.playerId];
    const playerId = al ? al.id : rawEntry.playerId;
    const playerName = al ? al.name : rawEntry.playerName;
    const e = Object.assign({}, rawEntry, {playerId, playerName});
    let p = map.get(playerId);
    if(!p){ p = {id:playerId, name:playerName, entries:[]}; map.set(playerId, p); }
    p.entries.push(e);
  }
  const players = Array.from(map.values()).filter(p=>!state.excluded.includes(p.id));
  players.forEach(p=>{
    // Si dos nombres unificados respondieron el mismo día, se queda la última respuesta.
    const byDate = new Map();
    for(const e of p.entries){
      const prev = byDate.get(e.date);
      if(!prev || (e.timeMs||0) >= (prev.timeMs||0)) byDate.set(e.date, e);
    }
    p.entries = Array.from(byDate.values())
      .sort((a,b)=> a.date===b.date ? (a.timeMs||0)-(b.timeMs||0) : a.date.localeCompare(b.date));
    if(p.entries.length) p.name = p.entries[p.entries.length-1].playerName || p.name;
  });
  players.sort((a,b)=> a.name.localeCompare(b.name,'es'));
  return players;
}

/* Tomas: días en los que al menos una jugadora respondió. El formulario se envía la

function tomaSet(){ return new Set(visibleEntries().map(e=>e.date)); }
function tomaDaysIn(days){ const set = tomaSet(); return (days || getRangeDays()).filter(d=>set.has(d)); }
function tomaDaysInRange(){ return tomaDaysIn(getRangeDays()); }

/* -------------------------- Estadística básica -------------------------- */
function getRangeDays(){
  if(!state.entries.length) return [];
  const today = todayISO();
  let start;
  if(state.range==='all'){
    const first = state.entries[0].date;
    const cap = addDays(today,-179);
    start = first < cap ? cap : first;
  }else{
    start = addDays(today, -(Number(state.range)-1));
  }
  const days = [];
  let cursor = start, guard = 0;
  while(cursor <= today && guard < 400){ days.push(cursor); cursor = addDays(cursor,1); guard++; }
  return days;
}
function dailyTeam(days){
  const byDate = new Map();
  for(const e of visibleEntries()){
    if(!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  }
  return days.map(date=>{
    const list = byDate.get(date) || [];
    return {
      date, list, n:list.length,
      fatigue:mean(list.map(e=>e.fatigue)),
      sleep:mean(list.map(e=>e.sleep)),
      discomfort:list.filter(e=>e.discomfort===1).length,
      period:list.filter(e=>e.period===1).length
    };
  });
}
function rangeStats(){
  const days = getRangeDays();
  if(!days.length) return null;
  const start = days[0], end = days[days.length-1];
  const list = visibleEntries().filter(e=>e.date>=start && e.date<=end);
  const fatigueN = list.filter(e=>e.fatigue!=null).length;
  const sleepN = list.filter(e=>e.sleep!=null).length;
  const disList = list.filter(e=>e.discomfort===1);
  const periodList = list.filter(e=>e.period===1);
  const lowSleep = list.filter(e=>e.sleep!=null && e.sleep<=state.thresholds.sleepLow).length;
  const activeDays = days.filter(d=>list.some(e=>e.date===d));
  const periodAvg = mean(activeDays.map(d=>list.filter(e=>e.date===d && e.period===1).length));
  let prev = null;
  if(state.range!=='all'){
    const n = Number(state.range);
    const pEnd = addDays(start,-1);
    const pStart = addDays(pEnd,-(n-1));
    const plist = visibleEntries().filter(e=>e.date>=pStart && e.date<=pEnd);
    if(plist.length) prev = {fatigue:mean(plist.map(e=>e.fatigue)), sleep:mean(plist.map(e=>e.sleep))};
  }
  return {
    days, start, end, n:list.length,
    players:uniq(list.map(e=>e.playerId)).length,
    fatigue:mean(list.map(e=>e.fatigue)),
    sleep:mean(list.map(e=>e.sleep)),
    fatigueN, sleepN, lowSleep,
    lowSleepPct: sleepN ? lowSleep/sleepN : null,
    discomfortPct: list.length ? disList.length/list.length : null,
    discomfortN: disList.length,
    discomfortPlayers: uniq(disList.map(e=>e.playerId)).length,
    periodPct: list.length ? periodList.length/list.length : null,
    periodPlayers: uniq(periodList.map(e=>e.playerId)).length,
    periodN: periodList.length,
    periodAvg,
    prev
  };
}
function fatigueTrend(p){
  const today = todayISO();
  const recent = mean(p.entries.filter(e=>e.date>=addDays(today,-6)).map(e=>e.fatigue));
  const prev = mean(p.entries.filter(e=>e.date>=addDays(today,-13) && e.date<=addDays(today,-7)).map(e=>e.fatigue));
  if(recent==null || prev==null) return null;
  return recent - prev;
}
/* Un día sin respuesta entre dos «sí» se asume que seguía con la regla. Solo se une si
   los días intermedios no tienen respuesta: si respondió «no», se respeta el no. */
function canBridgePeriod(byDate, from, to){
  const gap = daysBetween(from, to);
  if(gap < 2 || gap > 3) return false;
  for(let k=1;k<gap;k++){
    const mid = byDate.get(addDays(from, k));
    if(mid && mid.period===0) return false;
  }
  return true;
}
function periodDaySet(p){
  const byDate = new Map(p.entries.map(e=>[e.date, e]));
  const explicit = p.entries.filter(e=>e.period===1).map(e=>e.date).sort();
  const set = new Set(explicit);
  for(let i=1;i<explicit.length;i++){
    const from = explicit[i-1], to = explicit[i];
    if(canBridgePeriod(byDate, from, to)){
      const gap = daysBetween(from, to);
      for(let k=1;k<gap;k++) set.add(addDays(from, k));
    }
  }
  return set;
}
function periodEpisodes(p){
  const byDate = new Map(p.entries.map(e=>[e.date, e]));
  const dates = p.entries.filter(e=>e.period===1).map(e=>e.date).sort();
  const eps = [];
  for(const d of dates){
    const last = eps[eps.length-1];
    const gap = last ? daysBetween(last.end, d) : null;
    if(last && (gap===1 || canBridgePeriod(byDate, last.end, d))){
      last.end = d;
      last.days = daysBetween(last.start, d) + 1;
    }else{
      eps.push({start:d, end:d, days:1});
    }
  }
  return eps;
}
function cycleInfo(p){
  const eps = periodEpisodes(p);
  const starts = eps.map(e=>e.start);
  const lens = [];
  for(let i=1;i<starts.length;i++){
    const gap = daysBetween(starts[i-1], starts[i]);
    if(gap >= 15 && gap <= 60) lens.push(gap); // solo intervalos de ciclo creíbles
  }
  const avg = lens.length ? mean(lens) : null;
  const dur = mean(eps.map(e=>e.days));
  const last = eps[eps.length-1];
  const next = last ? addDays(last.start, Math.round(avg || 28)) : null;
  return {eps, lens, avg, dur, last, next};
}
function alertsFor(day){
  const th = state.thresholds;
  const out = [];
  for(const e of visibleEntries().filter(x=>x.date===day)){
    if(e.fatigue!=null && e.fatigue>=th.fatigueHigh)
      out.push({type:'fatigue', playerId:e.playerId, text:`${e.playerName}: fatiga ${e.fatigue}/10`, sev:e.fatigue});
    if(e.sleep!=null && e.sleep<=th.sleepLow)
      out.push({type:'sleep', playerId:e.playerId, text:`${e.playerName}: sueño ${e.sleep}/5`, sev:10-e.sleep});
    if(th.discomfort && e.discomfort===1)
      out.push({type:'discomfort', playerId:e.playerId, text:`${e.playerName}: ${e.discomfortNote || 'molestia'}`, sev:9});
    if(th.period && e.period===1)
      out.push({type:'period', playerId:e.playerId, text:`${e.playerName}: con la regla`, sev:5});
  }
  const seen = new Set();
  return out.filter(a=>{ const k=a.type+'|'+a.playerId; if(seen.has(k)) return false; seen.add(k); return true; })
            .sort((a,b)=> b.sev-a.sev);
}

function processDataset(headers, rows, meta, opts={}){
  headers = (headers||[]).map(h=>String(h==null?'':h).trim());
  rows = (rows||[]).filter(r=>Array.isArray(r) && r.some(c=>String(c==null?'':c).trim()!==''));
  if(!headers.length || !rows.length){
    toast('El origen no contiene filas de datos.','err');
    return false;
  }
  state.raw = {headers, rows};
  state.pendingMeta = meta;
  state.formSource = meta.kind==='sheet' ? 'sheet' : 'csv';
  state.mapping = savedMappingFor(headers) || autoMap(headers, rows);
  if(!requireColumns(state.mapping)){
    if(opts.background) throw new Error('faltan columnas por asignar');
    goView('datos');
    toast('He leído los datos, pero falta asignar la fecha o la jugadora. Revisa el mapeo en Datos.','warn');
    return false;
  }
  applyMapping({quiet:!!opts.background, resetView:!opts.background});
  return true;
}
function applyMapping(opts={}){
  const {raw, mapping, pendingMeta} = state;
  if(!raw) return;
  if(!requireColumns(mapping)){ toast('Asigna al menos las columnas de fecha y jugadora.','err'); return; }
  const idx = f => mapping.indexOf(f);
  const iTs=idx('timestamp'), iPlayer=idx('player'), iFat=idx('fatigue'), iSleep=idx('sleep'),
        iDis=idx('discomfort'), iNote=idx('note'), iPer=idx('period');
  // Si el formulario cambia de pregunta de nombre, puede quedar una columna antigua y otra nueva.
  const playerFallbacks = mapping.map((f,i)=> f==='player' && i!==iPlayer ? i : -1).filter(i=>i>=0);
  const byKey = new Map();
  let invalid = 0, dupes = 0;
  for(const row of raw.rows){
    let rawName = row[iPlayer];
    if(!String(rawName==null?'':rawName).trim()){
      for(const i of playerFallbacks){
        if(String(row[i]==null?'':row[i]).trim()){ rawName = row[i]; break; }
      }
    }
    const name = titleName(String(rawName==null?'':rawName).trim());
    const di = parseDateCell(row[iTs]);
    if(!name || !di){ invalid++; continue; }
    const fatigue = iFat>=0 ? parseScore(row[iFat],1,10) : null;
    const sleep = iSleep>=0 ? parseSleep(row[iSleep]) : null;
    let discomfort = null, note = '';
    if(iDis>=0){
      const parsed = parseDiscomfort(row[iDis]);
      discomfort = parsed.flag;
      note = parsed.note;
    }
    if(iNote>=0){
      const extra = String(row[iNote]==null?'':row[iNote]).trim();
      if(extra) note = extra;
    }
    if(discomfort==null && note) discomfort = 1;
    const period = iPer>=0 ? parseYesNo(row[iPer]) : null;
    const e = {
      playerName:name, playerId:slug(name), date:di.date, timeMs:di.timeMs||0,
      fatigue, sleep, discomfort, discomfortNote:note, period
    };
    const key = e.playerId+'|'+e.date;
    const prev = byKey.get(key);
    if(prev){ dupes++; if((e.timeMs||0) >= (prev.timeMs||0)) byKey.set(key,e); }
    else byKey.set(key,e);
  }
  const entries = Array.from(byKey.values()).sort((a,b)=> a.date===b.date ? (a.timeMs||0)-(b.timeMs||0) : a.date.localeCompare(b.date));
  if(!entries.length){ toast('No se ha podido leer ninguna respuesta. Revisa el mapeo de columnas.','err'); return; }
  const meta = pendingMeta || {kind:'sheet', label:'Google Sheets'};
  state.entries = entries;
  state.players = buildPlayers(entries);
  state.source = meta.kind==='demo' ? 'demo' : (meta.kind==='sheet' ? 'sheet' : 'file');
  state.sourceUrl = meta.url || '';
  state.sourceLabel = meta.label || (state.source==='sheet' ? 'Google Sheets' : state.source==='file' ? 'CSV' : 'Demo');
  state.lastUpdated = Date.now();
  state.importInfo = {
    imported:entries.length, players:uniq(entries.map(e=>e.playerId)).length,
    days:uniq(entries.map(e=>e.date)).length,
    from:entries[0].date, to:entries[entries.length-1].date,
    invalid, dupes, source:state.sourceLabel
  };
  state.savedMappings[signatureOf(raw.headers)] = mapping.slice();
  state.day = pickDefaultDay();
  if(state.selectedPlayer && !state.players.some(p=>p.id===state.selectedPlayer)) state.selectedPlayer = null;
  saveSettings(); saveCache();
  if(opts.resetView !== false){
    state.view = 'equipo';
    historySafeReplace('equipo');
  }
  render();
  scheduleAutoRefresh();
  if(!opts.quiet){
    toast(`Datos cargados: ${entries.length} respuestas de ${state.importInfo.players} jugadoras (${fmtDay(state.importInfo.from,{wd:false})} – ${fmtDay(state.importInfo.to,{wd:false})}).`,'ok');
  }
}
function parseDatasetText(text, label){
  const trimmed = String(text||'').trim();
  if(trimmed.startsWith('{') || trimmed.startsWith('[')){
    let data;
    try{ data = JSON.parse(trimmed); }catch(e){ throw new Error('JSON no válido'); }
    const values = Array.isArray(data) ? data : (data && Array.isArray(data.values) ? data.values : null);
    if(!values) throw new Error('el JSON no contiene la lista de filas');
    return processDataset(values[0], values.slice(1), {kind:'file', label:label||'JSON'}, {});
  }
  const ds = parseCSV(text);
  return processDataset(ds.headers, ds.rows, {kind:'file', label:label||'CSV'}, {});
}
function normalizeSheetUrl(url){
  const u = String(url||'').trim();
  if(!u) return u;
  if(u.includes('/spreadsheets/d/e/')) return u; // URL publicada como CSV
  const m = u.match(/docs\.google\.com\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if(!m) return u;
  if(u.includes('/gviz/') || u.includes('output=csv')) return u;
  const gid = (u.match(/[?#&]gid=(\d+)/)||[])[1];
  return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv${gid?'&gid='+gid:''}`;
}
function jsonp(url, timeoutMs=25000){
  return new Promise((resolve, reject)=>{
    const cb = '__wellness_cb_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let timer = null, done = false;
    const cleanup = ()=>{
      if(done) return;
      done = true;
      if(timer) clearTimeout(timer);
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      script.remove();
    };
    window[cb] = data => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('no se pudo cargar la URL de Google')); };
    const sep = url.includes('?') ? '&' : '?';
    script.src = url + sep + 'callback=' + cb + '&_=' + Date.now();
    document.head.appendChild(script);
    timer = setTimeout(()=>{ cleanup(); reject(new Error('tiempo de espera agotado')); }, timeoutMs);
  });
}
async function loadSheet(url, background=false, notify=false){
  if(!url){ toast('Falta la URL de la hoja.','warn'); return; }
  setLoading(true);
  try{
    let ds;
    if(/script\.google\.com/i.test(url)){
      let values = null;
      try{
        const data = await jsonp(url);
        values = data && Array.isArray(data.values) ? data.values : (Array.isArray(data) ? data : null);
      }catch(jsonpErr){
        // Si el navegador bloquea el JSONP, probamos lectura directa (funciona si Apps Script permite CORS).
        try{
          const res = await fetch(url, {cache:'no-store'});
          if(!res.ok) throw new Error('HTTP '+res.status);
          const data = JSON.parse(await res.text());
          values = data && Array.isArray(data.values) ? data.values : (Array.isArray(data) ? data : null);
        }catch(fetchErr){
          throw new Error(jsonpErr.message + ' / ' + fetchErr.message);
        }
      }
      if(!values || !values.length) throw new Error('la respuesta de Apps Script no contiene filas');
      ds = {headers:values[0], rows:values.slice(1)};
    }else{
      const target = normalizeSheetUrl(url);
      const res = await fetch(target, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      if(text.trim().startsWith('{')){
        let data; try{ data = JSON.parse(text); }catch(e){ throw new Error('JSON no válido'); }
        const values = data.values || data;
        if(!Array.isArray(values)) throw new Error('formato inesperado');
        ds = {headers:values[0], rows:values.slice(1)};
      }else{
        ds = parseCSV(text);
      }
    }
    processDataset(ds.headers, ds.rows, {kind:'sheet', url, label:'Google Sheets'}, {background});
    state.connectionMsg = 'Conectado y actualizando. Última lectura: ' + (new Date()).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    saveSettings();
    if(background) render();
    if(background && notify) toast('Datos actualizados desde Google Sheets.','ok');
  }catch(err){
    state.connectionMsg = 'No se pudo conectar: ' + err.message;
    console.warn('[wellness]', err);
    if(!background || notify){
      toast('No se pudo conectar con la hoja: ' + err.message + '. Revisa la URL o usa la importación CSV.','err');
    }
    render();
  }finally{
    setLoading(false);
  }
}
function loadCSVFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const ok = parseDatasetText(String(reader.result), file.name);
      if(ok) saveSettings();
    }catch(err){
      toast('No se pudo leer el archivo: '+err.message,'err');
    }
  };
  reader.onerror = ()=> toast('No se pudo leer el archivo.','err');
  reader.readAsText(file, 'utf-8');
}
function loadCSVText(text, label){
  try{ return parseDatasetText(text, label); }
  catch(err){ toast('No se pudo leer el CSV: '+err.message,'err'); return false; }
}

function heatmapHTML(days){

  const tomaDays = (days||[]).filter(d=>set.has(d));
  if(!tomaDays.length) return '<div class="muted">Sin días con respuesta que mostrar.</div>';
  const metric = state.metric;
  const maxDays = 60;
  const viewDays = tomaDays.slice(-maxDays);
  const cellPx = viewDays.length <= 20 ? 34 : 27;
  const byKey = new Map();
  visibleEntries().forEach(e=>byKey.set(e.playerId+'|'+e.date, e));
  const months = [];
  viewDays.forEach(d=>{
    const m = parseISO(d).getMonth();
    if(!months.length || months[months.length-1].m!==m) months.push({m, span:0});
    months[months.length-1].span++;
  });
  const today = todayISO();
  let h = `<div class="hm" style="grid-template-columns:148px repeat(${viewDays.length},${cellPx}px)">`;
  h += `<div class="hm-name hm-corner">Jugadora</div>`;
  months.forEach(seg=>{ h += `<div class="hm-month" style="grid-column:span ${seg.span}">${MONTHS[seg.m]}</div>`; });
  h += `<div class="hm-name" style="visibility:hidden"></div>`;
  viewDays.forEach(d=>{
    const dt = parseISO(d);
    h += `<div class="hm-date ${d===today?'is-today':''}" data-tip="${esc(fmtDay(d))}"><b>${dt.getDate()}</b><span>${WD[dt.getDay()]}</span></div>`;
  });
  state.players.forEach(p=>{
    h += `<div class="hm-name" title="${esc(p.name)}">${esc(p.name)}</div>`;
    viewDays.forEach(d=>{
      const e = byKey.get(p.id+'|'+d);
      const todayCls = d===today ? ' is-today' : '';
      if(!e){
        h += `<div class="hm-cell is-empty${todayCls}" data-tip="${esc(p.name)} · ${esc(fmtDay(d))}&#10;Sin respuesta"></div>`;
        return;
      }
      let bg = 'rgba(255,255,255,.05)', content = '', tip = `${p.name} · ${fmtDay(d)}`;
      if(metric==='fatiga'){
        if(e.fatigue!=null){ const rgb = fatigueRgb(e.fatigue); bg = rgbaStr(rgb,.42); content = String(e.fatigue); tip += `\nFatiga ${e.fatigue}/10`; }
        else tip += '\nFatiga sin dato';
      }else if(metric==='sueno'){
        if(e.sleep!=null){ const rgb = sleepRgb(e.sleep); bg = rgbaStr(rgb,.42); content = String(e.sleep); tip += `\nSueño ${e.sleep}/5 (${sleepLabel(e.sleep)})`; }
        else tip += '\nSueño sin dato';
      }else if(metric==='molestias'){
        if(e.discomfort===1){ bg = 'rgba(255,74,61,.5)'; content = '<i class="dot"></i>'; tip += `\nMolestia: ${e.discomfortNote||'sí'}`; }
        else tip += '\nSin molestia';
      }else if(metric==='regla'){
        if(e.period===1){ bg = 'rgba(167,139,250,.5)'; content = '<i class="dot"></i>'; tip += '\nCon la regla'; }
        else tip += '\nSin regla';
      }
      h += `<div class="hm-cell${todayCls}" style="background:${bg}" data-tip="${esc(tip).replace(/\n/g,'&#10;')}" data-action="open-player" data-player="${esc(p.id)}">${content}</div>`;
    });
  });
  h += '</div>';
  if(tomaDays.length > maxDays) h += `<div class="scale" style="margin-top:6px"><span>Mostrando las últimas ${maxDays} tomas de ${tomaDays.length}. Cambia el periodo para acercar.</span></div>`;

}

function monthLabel(monthKeyStr){
  const parts = String(monthKeyStr).split('-').map(Number);
  const name = MONTHS_FULL[parts[1]-1] || '';
  return `${name.charAt(0).toUpperCase()+name.slice(1)} ${parts[0]}`;
}
function calendarWeeks(monthKeyStr){
  const parts = String(monthKeyStr).split('-').map(Number);
  const year = parts[0], month = parts[1];
  const offset = (new Date(year, month-1, 1).getDay() + 6) % 7; // lunes primero
  const total = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=0;i<offset;i++) cells.push(null);
  for(let d=1; d<=total; d++) cells.push(`${year}-${pad(month)}-${pad(d)}`);
  while(cells.length % 7) cells.push(null);
  const weeks = [];
  for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  return weeks;
}
function calendarCardHTML(p, cycle){
  const today = todayISO();
  const lastEntryDate = p.entries.length ? p.entries[p.entries.length-1].date : today;
  if(!state.calendarMonth || !/^\d{4}-\d{2}$/.test(state.calendarMonth)){
    state.calendarMonth = (lastEntryDate || today).slice(0,7);
  }
  if(state.calendarMonth > today.slice(0,7)) state.calendarMonth = today.slice(0,7);
  const mk = state.calendarMonth;
  const byDate = new Map(p.entries.map(e=>[e.date, e]));
  const periodSet = periodDaySet(p);
  const weeks = calendarWeeks(mk);
  const head = ['L','M','X','J','V','S','D'].map(w=>`<span>${w}</span>`).join('');
  const weekHTML = weeks.map(week=>`<div class="cal-week">${week.map(date=>{
    if(!date) return '<div class="cal-day is-empty"></div>';
    const e = byDate.get(date);
    const explicitPeriod = !!(e && e.period===1);
    const inferredPeriod = !explicitPeriod && periodSet.has(date);
    const isPeriod = explicitPeriod || inferredPeriod;
    let tip = fmtDay(date,{wd:true});
    if(e){
      tip += `\nRegla: ${explicitPeriod ? 'sí' : e.period===0 ? 'no' : 'sin dato'}`;
      if(e.fatigue!=null) tip += `\nFatiga: ${e.fatigue}/10`;
      if(e.sleep!=null) tip += `\nCalidad del sueño: ${e.sleep}/5`;
      if(e.discomfort===1) tip += `\nMolestia: ${e.discomfortNote||'sí'}`;
    }else{
      tip += inferredPeriod ? '\nRegla: sí (se asume: día sin respuesta entre dos «sí»)' : '\nSin respuesta';
    }
    return `<div class="cal-day${e?' has-data':''}${isPeriod?' is-period':''}${date===today?' is-today':''}" data-date="${date}" data-tip="${esc(tip).replace(/\n/g,'&#10;')}"><span class="n">${parseInt(date.slice(8,10),10)}</span>${isPeriod?'<i class="cal-dot"></i>':''}</div>`;
  }).join('')}</div>`).join('');
  const periodInMonth = Array.from(periodSet).filter(d=>d.startsWith(mk)).length;
  const currentMonth = today.slice(0,7);
  return `<div class="card">
      <div class="card-head">
        <div><h3>Ciclo menstrual</h3><div class="hint">Punto rojo: días con la regla. Si entre dos «sí» hay un día sin respuesta, se asume que seguía y también se marca.</div></div>
        <div class="side">
          <button type="button" class="btn btn-sm" data-action="cal-prev" title="Mes anterior">‹</button>
          <span class="chip" style="border-color:rgba(255,122,26,.35);color:var(--text)">${monthLabel(mk)}</span>
          <button type="button" class="btn btn-sm" data-action="cal-next" ${mk>=currentMonth?'disabled':''} title="Mes siguiente">›</button>
        </div>
      </div>
      <div class="calendar-wrap">
        <div class="calendar"><div class="cal-head">${head}</div>${weekHTML}</div>
        <div class="calendar-side">
          <div class="cycle-stats">
            <div class="cycle-stat"><div class="label">Último inicio</div><div class="value">${cycle.eps.length?fmtDay(cycle.last.start,{wd:false}):'—'}</div></div>
            <div class="cycle-stat"><div class="label">Ciclo medio</div><div class="value">${cycle.avg!=null?num1(cycle.avg)+' <small>días</small>':'<small>sin historial</small>'}</div></div>
            <div class="cycle-stat"><div class="label">Próximo inicio aprox.</div><div class="value">${cycle.next?fmtDay(cycle.next,{wd:false}):'—'}</div></div>
          </div>
          <div class="calendar-legend">
            <span class="k"><i class="dot-red"></i>Día con la regla</span>
            <span class="k"><i class="dot-today"></i>Hoy</span>
          </div>
          <p class="nota">${periodInMonth} día${periodInMonth===1?'':'s'} marcado${periodInMonth===1?'':'s'} en ${monthLabel(mk)} (incluye días sin respuesta entre dos «sí»).${cycle.avg==null?' Con un solo ciclo registrado, el próximo inicio se estima usando 28 días como referencia.':''} La predicción es aproximada y no sustituye a lo que indique la jugadora.</p>
        </div>
      </div>
    </div>`;
}

function sparklineSVG(p, w=58, h=20){
  const vals = p.entries.slice(-18).filter(e=>e.fatigue!=null);
  if(vals.length < 2) return '<span class="spark muted">—</span>';
  const padPx = 2;
  const pts = vals.map((e,i)=>{
    const x = padPx + (i*(w-2*padPx))/(vals.length-1);
    const y = padPx + (1-((e.fatigue-1)/9))*(h-2*padPx);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const last = vals[vals.length-1].fatigue;
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" stroke="${fatigueColor(last)}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function currentPlayer(){

function teamChartSVG(width, metric){
  const rangeDays = getRangeDays();
  // Solo tomas: días en los que hubo alguna respuesta. Los días sin formulario no se dibujan.
  const daily = dailyTeam(rangeDays).filter(d=>d.n>0);
  const days = daily.map(d=>d.date);
  const values = daily.map(d=> metric==='fatigue' ? d.fatigue : d.sleep);
  if(!values.some(v=>v!=null)) return '';
  const H = 236, padL = 34, padR = 14, padT = 18, padB = 30;
  const W = Math.max(320, width);
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const yMax = metric==='fatigue' ? 10 : 5, yMin = 1;
  const n = days.length;
  const step = n>1 ? plotW/(n-1) : plotW;
  const x = i => padL + (n>1 ? i*step : plotW/2);
  const y = v => padT + (1-((v-yMin)/(yMax-yMin)))*plotH;
  const rgb = metric==='fatigue' ? ACCENT_RGB : BLUE_RGB;
  const color = rgbStr(rgb);
  const ticks = metric==='fatigue' ? [2,4,6,8,10] : [1,2,3,4,5];
  const threshold = metric==='fatigue' ? state.thresholds.fatigueHigh : state.thresholds.sleepLow;
  const gradId = 'grad-'+metric;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${metric==='fatigue'?'Fatiga media del equipo':'Calidad del sueño del equipo'}">`;
  s += `<defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${rgbaStr(rgb,.32)}"/><stop offset="1" stop-color="${rgbaStr(rgb,0)}"/></linearGradient></defs>`;
  ticks.forEach(t=>{
    const yy = y(t);
    s += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="rgba(255,255,255,.055)" stroke-width="1"/>`;
    s += `<text x="${padL-7}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#71839b">${t}</text>`;
  });
  if(threshold>yMin && threshold<yMax){
    const ty = y(threshold);
    s += `<line x1="${padL}" y1="${ty.toFixed(1)}" x2="${W-padR}" y2="${ty.toFixed(1)}" stroke="${rgbaStr(rgb,.5)}" stroke-width="1" stroke-dasharray="4 4"/>`;
    s += `<text x="${W-padR}" y="${(ty-5).toFixed(1)}" text-anchor="end" font-size="8.5" fill="#9aaac1">umbral ${threshold}</text>`;
  }
  const labelSet = new Set(xLabelIndices(n,7));
  days.forEach((d,i)=>{
    if(!labelSet.has(i)) return;
    const anchor = i===0 ? 'start' : (i===n-1 ? 'end' : 'middle');
    s += `<text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="${anchor}" font-size="9" fill="#71839b">${fmtDay(d)}</text>`;
  });
  const pts = [];
  values.forEach((v,i)=>{ if(v!=null) pts.push([x(i), y(v), i]); });
  if(pts.length){
    const base = y(yMin);
    const line = pts.map(([px,py])=>`${px.toFixed(1)},${py.toFixed(1)}`).join(' ');
    const area = `M ${pts[0][0].toFixed(1)} ${base.toFixed(1)} L ` + pts.map(([px,py])=>`${px.toFixed(1)} ${py.toFixed(1)}`).join(' L ') + ` L ${pts[pts.length-1][0].toFixed(1)} ${base.toFixed(1)} Z`;
    s += `<path d="${area}" fill="url(#${gradId})"/>`;
    s += `<polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(([px,py])=>{ s += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.8" fill="#0b1421" stroke="${color}" stroke-width="1.8"/>`; });
  }
  const colW = n>1 ? step : plotW;
  daily.forEach((d,i)=>{
    if(!d.n) return;
    const left = Math.max(padL, n>1 ? x(i)-step/2 : padL);
    const widthRect = Math.max(6, Math.min(colW, W-padR-left));
    const tip = `${fmtDay(d.date)}\n${metric==='fatigue'?'Fatiga media':'Sueño medio'}: ${num1(metric==='fatigue'?d.fatigue:d.sleep)}${d.n?'/'+(metric==='fatigue'?10:5):''}\n${d.n} respuestas`;
    s += `<rect x="${left.toFixed(1)}" y="${padT}" width="${widthRect.toFixed(1)}" height="${plotH}" fill="transparent" data-tip="${esc(tip).replace(/\n/g,'&#10;')}"/>`;
  });
  s += '</svg>';
  return s;
}
function playerFatigueSVG(width, p){
  const days = tomaDaysInRange();
  if(!days.length) return '';
  const H = 250, padL = 34, padR = 14, padT = 16, padB = 30;
  const W = Math.max(320, width);
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const n = days.length;
  const step = n>1 ? plotW/(n-1) : plotW;
  const x = i => padL + (n>1 ? i*step : plotW/2);
  const y = v => padT + (1-((v-1)/9))*plotH;
  const byDate = new Map(p.entries.map(e=>[e.date,e]));
  const periodSet = periodDaySet(p);
  const team = dailyTeam(days);
  const teamByDate = new Map(team.map(d=>[d.date,d]));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fatiga de ${esc(p.name)}">`;
  const zones = [[10,8,'rgba(255,74,61,.075)'],[8,6,'rgba(255,122,26,.075)'],[6,4,'rgba(255,197,61,.055)'],[4,1,'rgba(47,208,122,.06)']];
  zones.forEach(([a,b,fill])=>{
    const y1 = y(a), y2 = y(b);
    s += `<rect x="${padL}" y="${y1.toFixed(1)}" width="${plotW.toFixed(1)}" height="${(y2-y1).toFixed(1)}" fill="${fill}"/>`;
  });
  [2,4,6,8,10].forEach(t=>{
    const yy = y(t);
    s += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="rgba(255,255,255,.055)"/>`;
    s += `<text x="${padL-7}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#71839b">${t}</text>`;
  });
  const labelSet = new Set(xLabelIndices(n,8));
  days.forEach((d,i)=>{
    if(!labelSet.has(i)) return;
    const anchor = i===0 ? 'start' : (i===n-1 ? 'end' : 'middle');
    s += `<text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="${anchor}" font-size="9" fill="#71839b">${fmtDay(d)}</text>`;
  });
  const bandW = Math.max(6, Math.min(step*0.62, 16));
  days.forEach((d,i)=>{
    // También se marca el día sin respuesta entre dos «sí» (se asume que seguía).
    if(periodSet.has(d)){
      const cx = x(i);
      s += `<rect x="${(cx-bandW/2).toFixed(1)}" y="${padT}" width="${bandW.toFixed(1)}" height="${plotH}" fill="rgba(167,139,250,.15)"/>`;
    }
  });
  const ty = y(7);
  s += `<line x1="${padL}" y1="${ty.toFixed(1)}" x2="${W-padR}" y2="${ty.toFixed(1)}" stroke="rgba(255,122,26,.45)" stroke-dasharray="4 4"/>`;
  s += `<text x="${W-padR}" y="${(ty-5).toFixed(1)}" text-anchor="end" font-size="8.5" fill="#9aaac1">umbral 7</text>`;
  if(state.compareTeam){
    const teamPts = [];
    days.forEach((d,i)=>{ const t = teamByDate.get(d); if(t && t.fatigue!=null) teamPts.push([x(i), y(t.fatigue)]); });
    if(teamPts.length>1){
      s += `<polyline points="${teamPts.map(([a,b])=>`${a.toFixed(1)},${b.toFixed(1)}`).join(' ')}" fill="none" stroke="rgba(154,170,193,.42)" stroke-width="1.3" stroke-dasharray="3 4"/>`;
    }
  }
  const pts = [];
  days.forEach((d,i)=>{ const e = byDate.get(d); if(e && e.fatigue!=null) pts.push([x(i), y(e.fatigue), e]); });
  if(pts.length){
    s += `<defs><linearGradient id="pfgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,122,26,.30)"/><stop offset="1" stop-color="rgba(255,122,26,0)"/></linearGradient></defs>`;
    const base = y(1);
    const area = `M ${pts[0][0].toFixed(1)} ${base.toFixed(1)} L ` + pts.map(([a,b])=>`${a.toFixed(1)} ${b.toFixed(1)}`).join(' L ') + ` L ${pts[pts.length-1][0].toFixed(1)} ${base.toFixed(1)} Z`;
    s += `<path d="${area}" fill="url(#pfgrad)"/>`;
    s += `<polyline points="${pts.map(([a,b])=>`${a.toFixed(1)},${b.toFixed(1)}`).join(' ')}" fill="none" stroke="#ff7a1a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(([a,b,e])=>{
      const rgb = fatigueRgb(e.fatigue);
      s += `<circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="3.1" fill="#0b1421" stroke="${rgbStr(rgb)}" stroke-width="1.9"/>`;
      if(e.discomfort===1) s += `<circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="6.4" fill="none" stroke="rgba(255,74,61,.85)" stroke-width="1.2"/>`;
    });
  }
  days.forEach((d,i)=>{
    const e = byDate.get(d);
    if(!e) return;
    const t = teamByDate.get(d);
    let tip = `${fmtDay(d)}\nFatiga: ${e.fatigue!=null?e.fatigue+'/10':'—'} · Sueño: ${e.sleep!=null?e.sleep+'/5':'—'}`;
    if(t && t.fatigue!=null && state.compareTeam) tip += `\nMedia del equipo: ${num1(t.fatigue)}/10`;
    if(e.discomfort===1) tip += `\nMolestia: ${e.discomfortNote||'sí'}`;
    if(e.period===1) tip += '\nRegla: sí';
    const left = Math.max(padL, n>1 ? x(i)-step/2 : padL);
    const widthRect = Math.max(8, Math.min(n>1?step:plotW, W-padR-left));
    s += `<rect x="${left.toFixed(1)}" y="${padT}" width="${widthRect.toFixed(1)}" height="${plotH}" fill="transparent" data-tip="${esc(tip).replace(/\n/g,'&#10;')}"/>`;
  });
  s += '</svg>';
  return s;
}
function playerSleepSVG(width, p){
  const days = tomaDaysInRange();
  if(!days.length) return '';
  const H = 200, padL = 34, padR = 14, padT = 16, padB = 30;
  const W = Math.max(320, width);
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const n = days.length;
  const step = n>1 ? plotW/(n-1) : plotW;
  const x = i => padL + (n>1 ? i*step : plotW/2);
  const y = v => padT + (1-((v-1)/4))*plotH;
  const byDate = new Map(p.entries.map(e=>[e.date,e]));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calidad del sueño de ${esc(p.name)}">`;
  [1,2,3,4,5].forEach(t=>{
    const yy = y(t);
    s += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="rgba(255,255,255,.055)"/>`;
    s += `<text x="${padL-7}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#71839b">${t}</text>`;
  });
  const labelSet = new Set(xLabelIndices(n,8));
  days.forEach((d,i)=>{
    if(!labelSet.has(i)) return;
    const anchor = i===0 ? 'start' : (i===n-1 ? 'end' : 'middle');
    s += `<text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="${anchor}" font-size="9" fill="#71839b">${fmtDay(d)}</text>`;
  });
  const ty = y(state.thresholds.sleepLow);
  s += `<line x1="${padL}" y1="${ty.toFixed(1)}" x2="${W-padR}" y2="${ty.toFixed(1)}" stroke="rgba(110,168,254,.45)" stroke-dasharray="4 4"/>`;
  s += `<text x="${W-padR}" y="${(ty-5).toFixed(1)}" text-anchor="end" font-size="8.5" fill="#9aaac1">umbral ${state.thresholds.sleepLow}</text>`;
  const barW = Math.max(5, Math.min(step*0.55, 20));
  days.forEach((d,i)=>{
    const e = byDate.get(d);
    if(!e || e.sleep==null) return;
    const cx = x(i);
    const top = y(e.sleep);
    const bottom = y(1);
    const rgb = sleepRgb(e.sleep);
    s += `<rect x="${(cx-barW/2).toFixed(1)}" y="${top.toFixed(1)}" width="${barW.toFixed(1)}" height="${(bottom-top).toFixed(1)}" rx="3" fill="${rgbaStr(rgb,.72)}"/>`;
  });
  days.forEach((d,i)=>{
    const e = byDate.get(d);
    if(!e) return;
    const tip = `${fmtDay(d)}\nSueño: ${e.sleep!=null?e.sleep+'/5 ( '+sleepLabel(e.sleep)+' )':'sin dato'}`;
    const left = Math.max(padL, n>1 ? x(i)-step/2 : padL);
    const widthRect = Math.max(8, Math.min(n>1?step:plotW, W-padR-left));
    s += `<rect x="${left.toFixed(1)}" y="${padT}" width="${widthRect.toFixed(1)}" height="${plotH}" fill="transparent" data-tip="${esc(tip).replace(/\n/g,'&#10;')}"/>`;
  });
  s += '</svg>';
  return s;
}

const CODE_GS = `/**
 * Wellness · Huddle7 — fuente de datos para el panel
 *
 * 1. Abre la hoja de respuestas del formulario.
 * 2. Extensiones > Apps Script. Borra lo que haya y pega este código.
 * 3. Guarda y implementa: Implementar > Nueva implementación > Aplicación web.
 *    - Ejecutar como: Yo

function doGet(e) {
  var libro = SpreadsheetApp.getActiveSpreadsheet();
  var nombre = (e && e.parameter && e.parameter.sheet) || '';
  var hoja = nombre ? libro.getSheetByName(nombre) : libro.getSheets()[0];
  if (!hoja) {
    return ContentService
      .createTextOutput(JSON.stringify({ ok: false, error: 'Hoja no encontrada' }))
      .setMimeType(ContentService.MimeType.JSON);
  }
  var valores = hoja.getDataRange().getDisplayValues();
  var payload = JSON.stringify({
    ok: true,
    updatedAt: new Date().toISOString(),
    values: valores
  });
  var cb = e && e.parameter && e.parameter.callback;
  if (cb) {
    return ContentService
      .createTextOutput(cb + '(' + payload + ');')
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  return ContentService
    .createTextOutput(payload)
    .setMimeType(ContentService.MimeType.JSON);
}`;

function nameMergeSuggestions(){
  const players = state.players || [];
  const tokens = players.map(p=>({p, t:norm(p.name).split(' ').filter(Boolean)}));
  const out = [];
  for(let i=0;i<tokens.length;i++){
    for(let j=i+1;j<tokens.length;j++){
      const a = tokens[i], b = tokens[j];
      const short = a.t.length <= b.t.length ? a : b;
      const long = short === a ? b : a;
      if(short.t.length>=2 && short.t.length<long.t.length && short.t.every((w,k)=> w===long.t[k])){
        out.push({from:short.p, to:long.p});
      }
    }
  }
  return out;
}
