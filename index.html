    body = '<p class="form-note">Ahora mismo estás abriendo el panel como archivo local. Para compartirlo con el equipo, abre la versión publicada del panel (la dirección web que te he dado) y genera allí el enlace.</p>';
  }else if(!state.sourceUrl){
    body = '<p class="form-note">Conecta primero tu hoja de Google Sheets. Entonces podrás generar un enlace que abra el panel ya con los datos y la actualización automática. Sin fuente, el enlace solo mostraría los datos de ejemplo.</p>';
  }else{
    const link = buildShareLink();
    body = `<div class="row">
        <input class="input" id="shareLink" readonly value="${esc(link)}" spellcheck="false">
        <button type="button" class="btn btn-primary" data-action="copy-share">Copiar enlace</button>
      </div>
      <p class="form-note">Quien abra este enlace verá el panel conectado a tu hoja, sin configurar nada, y se actualizará cada 5 minutos. <b>El enlace contiene la dirección privada de tu Apps Script</b>: mándalo solo por canales internos del club. Si se filtra, crea otra implementación en Apps Script y genera un enlace nuevo.</p>`;
  }
  return `<div class="card mb-14" id="shareCard">
    <div class="card-head">
      <div><h3>Compartir con el equipo técnico</h3><div class="hint">Un enlace para que tus compañeros abran el panel con los datos.</div></div>
      <div class="side">${state.sourceUrl ? '<span class="tag" style="background:rgba(47,208,122,.14);color:#9ff0c1">Listo para compartir</span>' : ''}</div>
    </div>
    ${body}
  </div>`;
}
function privacyCardHTML(){
  return `<div class="card privacy">
    <div class="card-head"><div><h3>Privacidad y datos sensibles</h3><div class="hint">Fatiga, molestias, sueño y regla son datos de salud.</div></div></div>
    <p><strong>Todo se queda en tu equipo.</strong> El panel es un archivo local: no hay servidor propio ni base de datos en la nube. Si conectas Google Sheets, las respuestas están en tu cuenta de Google, como hasta ahora.</p>
    <p><strong>La regla es un dato de categoría especial</strong> según el RGPD. Informa a las jugadoras de qué se recoge, para qué y durante cuánto tiempo; pide su consentimiento y limita el acceso a las personas del cuerpo técnico que lo necesiten. Evita compartir la URL de Apps Script o el CSV fuera del club.</p>
    <p><strong>Antes de integrarlo en Huddle7</strong> el panel se puede usar como está. La app de escritorio guardará estos datos en local, sin nube, y permitirá exportarlos o borrarlos.</p>
  </div>`;
}
/* =========================================================================
   Interacción · actualización · inicialización
   ========================================================================= */
let autoTimer = null;
function scheduleAutoRefresh(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
  if(state.source==='sheet' && state.sourceUrl && Number(state.autoRefreshSec)>0){
    autoTimer = setInterval(()=>{
      if(document.hidden || state.loading) return;
      loadSheet(state.sourceUrl, true);
    }, Number(state.autoRefreshSec)*1000);
  }
}
function goView(v){
  if(!['equipo','jugadoras','datos'].includes(v)) return;
  const sameHash = location.hash.slice(1) === v;
  state.view = v;
  saveSettings();
  if(!sameHash && !historySafeReplace(v)) location.hash = v;
  else render();
}
function historySafeReplace(v){
  try{ history.replaceState(null, '', '#'+v); return true; }catch(e){ return false; }
}
function goPlayer(id){
  state.selectedPlayer = id;
  state.playerQuery = '';
  goView('jugadoras');
}
function refreshNow(){
  if(state.source==='sheet' && state.sourceUrl){
    loadSheet(state.sourceUrl, false);
  }else if(state.source==='demo'){
    loadDemo();
  }else{
    toast('La fuente actual es un CSV cargado: para actualizarlo, vuelve a importarlo desde Datos.','warn');
    goView('datos');
  }
}
function connectSheet(){
  const input = $('#sheetUrl');
  const url = (input ? input.value : state.sourceUrl || '').trim();
  if(!url){ toast('Pega la URL de Apps Script de tu hoja de Google.','warn'); return; }
  state.sourceUrl = url;
  state.formSource = 'sheet';
  saveSettings();
  loadSheet(url, false);
}
function exportJSON(){
  if(!state.entries.length){ toast('No hay datos para exportar.','warn'); return; }
  const payload = {
    schema:1,
    exportedAt:new Date().toISOString(),
    team:teamLabel(),
    source:state.source,
    playerAliases:state.playerAliases,
    entries:state.entries
  };
  downloadBlob('wellness-'+todayISO()+'.json', JSON.stringify(payload,null,2), 'application/json');
  toast('Datos exportados en JSON.','ok');
}
function resetConfig(){
  try{ localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_CACHE); }catch(e){}
  Object.assign(state, defaultState());
  state.entries = buildDemo();
  state.players = buildPlayers(state.entries);
  state.source = 'demo'; state.sourceLabel='Demo';
  state.day = pickDefaultDay();
  state.view = 'equipo';
  state.formSource = null;
  state.connectionMsg = '';
  saveSettings();
  toast('Configuración borrada. Vuelves a los datos de ejemplo.','ok');
  goView('equipo');
}

/* ------------------------------- Listeners ------------------------------ */
document.addEventListener('click', ev=>{
  const tab = ev.target.closest('.tab');
  if(tab){ ev.preventDefault(); goView(tab.dataset.view); return; }
  const el = ev.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  switch(action){
    case 'refresh': refreshNow(); break;
    case 'range':{
      const r = el.dataset.range;
      state.range = r==='all' ? 'all' : Number(r);
      saveSettings(); render(); break;
    }
    case 'metric': state.metric = el.dataset.metric; saveSettings(); render(); break;
    case 'select-player':
    case 'open-player': goPlayer(el.dataset.player); break;
    case 'day-prev': {
      const tomas = allTomaDays();
      const idx = tomas.indexOf(state.day);
      if(idx > 0){ state.day = tomas[idx-1]; render(); }
      break;
    }
    case 'day-next': {
      const tomas = allTomaDays();
      const idx = tomas.indexOf(state.day);
      if(idx >= 0 && idx < tomas.length-1){ state.day = tomas[idx+1]; render(); }
      break;
    }
    case 'day-today': {
      const tomas = allTomaDays();
      if(tomas.length){ state.day = tomas[tomas.length-1]; render(); }
      break;
    }
    case 'cal-prev': {
      const mk = state.calendarMonth || todayISO().slice(0,7);
      const parts = mk.split('-').map(Number);
      const d = new Date(parts[0], parts[1]-2, 1);
      state.calendarMonth = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
      render();
      break;
    }
    case 'cal-next': {
      const mk = state.calendarMonth || todayISO().slice(0,7);
      const parts = mk.split('-').map(Number);
      const d = new Date(parts[0], parts[1], 1);
      state.calendarMonth = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
      render();
      break;
    }
    case 'load-demo': loadDemo(); break;
    case 'goto-datos': goView('datos'); break;
    case 'source-option': state.formSource = el.dataset.source; render(); break;
    case 'connect-sheet': connectSheet(); break;
    case 'copy-gs': copyText(CODE_GS).then(ok=> toast(ok ? 'Script copiado al portapapeles.' : 'No se pudo copiar: selecciona el texto y cópialo a mano.', ok?'ok':'warn')); break;
    case 'copy-share': {
      const link = buildShareLink();
      copyText(link).then(ok=> toast(ok ? 'Enlace para el equipo copiado al portapapeles.' : 'No se pudo copiar: selecciona el enlace y cópialo a mano.', ok?'ok':'warn'));
      break;
    }
    case 'merge-player': {
      const fromId = el.dataset.from, toId = el.dataset.to;
      const target = state.players.find(p=>p.id===toId);
      if(target && fromId && fromId!==toId){
        state.playerAliases = Object.assign({}, state.playerAliases, {[fromId]:{id:toId, name:target.name}});
        saveSettings();
        state.players = buildPlayers(state.entries);
        if(state.importInfo) state.importInfo.players = state.players.length;
        state.selectedPlayer = toId;
        saveCache();
        render();
        toast(`Jugadoras unificadas en «${target.name}».`,'ok');
      }
      break;
    }
    case 'clear-aliases': {
      state.playerAliases = {};
      saveSettings();
      state.players = buildPlayers(state.entries);
      if(state.importInfo) state.importInfo.players = state.players.length;
      saveCache();
      render();
      toast('Unificaciones deshechas.','ok');
      break;
    }
    case 'load-sample': loadCSVText(SAMPLE_CSV, 'CSV de ejemplo'); break;
    case 'apply-mapping': applyMapping({resetView:true}); break;
    case 'export-json': exportJSON(); break;
    case 'reset-config': resetConfig(); break;
    default: break;
  }
});

document.addEventListener('change', ev=>{
  const el = ev.target;
  if(el.matches('#csvFile')){
    const file = el.files && el.files[0];
    el.value = '';
    if(file) loadCSVFile(file);
    return;
  }
  if(el.matches('select[data-action="map-field"]')){
    const i = Number(el.dataset.index);
    state.mapping[i] = el.value || null;
    render();
    return;
  }
  if(el.matches('select[data-action="refresh-interval"]')){
    state.autoRefreshSec = Number(el.value);
    saveSettings(); scheduleAutoRefresh(); render();
    if(state.autoRefreshSec>0 && state.source!=='sheet') toast('La actualización automática solo está disponible con Google Sheets.','warn');
    return;
  }
  if(el.matches('input[data-action="threshold"]')){
    const key = el.dataset.key;
    let v = Number(el.value);
    if(Number.isNaN(v)) return;
    v = key==='fatigueHigh' ? clamp(Math.round(v),5,10) : clamp(Math.round(v),1,4);
    state.thresholds[key] = v;
    saveSettings(); render();
    return;
  }
  if(el.matches('input[data-action="threshold-check"]')){
    state.thresholds[el.dataset.key] = !!el.checked;
    saveSettings(); render();
    return;
  }
  if(el.matches('input[data-action="compare-team"]')){
    state.compareTeam = !!el.checked;
    saveSettings(); render();
    return;
  }
  if(el.matches('input[data-action="team-name"]')){
    state.teamName = el.value.trim();
    saveSettings(); updateChrome(); render();
    return;
  }
});

document.addEventListener('input', ev=>{
  const el = ev.target;
  if(el.id==='playerSearch'){
    state.playerQuery = el.value;
    const q = norm(el.value);
    $$('#playerList .player-item').forEach(item=>{
      item.style.display = (!q || String(item.dataset.name||'').includes(q)) ? '' : 'none';
    });
  }
});

['dragenter','dragover'].forEach(type=>{
  document.addEventListener(type, ev=>{
    const dz = ev.target.closest('#dropzone');
    if(!dz) return;
    ev.preventDefault();
    dz.classList.add('is-over');
  });
});
['dragleave','drop'].forEach(type=>{
  document.addEventListener(type, ev=>{
    const dz = ev.target.closest('#dropzone');
    if(!dz) return;
    ev.preventDefault();
    dz.classList.remove('is-over');
    if(type==='drop'){
      const file = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
      if(file) loadCSVFile(file);
    }
  });
});

const tipEl = $('#tooltip');
function positionTip(x,y){
  if(!tipEl) return;
  const padPx = 14;
  const rect = tipEl.getBoundingClientRect();
  let left = x + padPx;
  let top = y + padPx;
  if(left + rect.width > window.innerWidth - 8) left = x - rect.width - padPx;
  if(top + rect.height > window.innerHeight - 8) top = y - rect.height - padPx;
  tipEl.style.left = Math.max(6,left)+'px';
  tipEl.style.top = Math.max(6,top)+'px';
}
document.addEventListener('mouseover', ev=>{
  const target = ev.target.closest('[data-tip]');
  if(!target || !tipEl) return;
  const text = target.getAttribute('data-tip');
  if(!text) return;
  tipEl.textContent = text;
  tipEl.classList.add('is-on');
  positionTip(ev.clientX, ev.clientY);
});
document.addEventListener('mousemove', ev=>{
  if(tipEl && tipEl.classList.contains('is-on')) positionTip(ev.clientX, ev.clientY);
});
document.addEventListener('mouseout', ev=>{
  const target = ev.target.closest('[data-tip]');
  if(target && tipEl) tipEl.classList.remove('is-on');
});
window.addEventListener('scroll', ()=>{ if(tipEl) tipEl.classList.remove('is-on'); }, true);

window.addEventListener('hashchange', ()=>{
  const v = location.hash.slice(1);
  if(['equipo','jugadoras','datos'].includes(v)){
    state.view = v;
    render();
  }
});
window.addEventListener('resize', debounce(()=>mountCharts(), 160));
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  if(state.source==='sheet' && state.sourceUrl && state.lastUpdated){
    const stale = Date.now() - state.lastUpdated > Math.max(60, Number(state.autoRefreshSec)||300) * 1000;
    if(stale) loadSheet(state.sourceUrl, true);
  }
});
function showFatal(msg){
  const el = $('#errbar');
  if(!el) return;
  el.hidden = false;
  el.textContent = 'Error en el panel: ' + msg;
}
window.addEventListener('error', e=> showFatal(e.message || 'error desconocido'));
window.addEventListener('unhandledrejection', e=> showFatal((e.reason && e.reason.message) || String(e.reason)));

/* -------------------------------- Arranque ------------------------------ */
function init(){
  try{
    loadSettings();
    const params = new URLSearchParams(location.search);
    const fuenteParam = params.get('fuente');
    const equipoParam = params.get('equipo');
    if(equipoParam) state.teamName = equipoParam;
    if(fuenteParam){
      try{
        const decoded = decodeFuente(fuenteParam);
        if(/^https?:\/\//i.test(decoded)){
          state.source = 'sheet';
          state.sourceUrl = decoded;
          state.sourceLabel = 'Google Sheets';
        }
      }catch(err){ console.warn('Enlace de equipo no válido', err); }
    }
    const hash = location.hash.replace('#','');
    const validViews = ['equipo','jugadoras','datos'];
    if(validViews.includes(hash)) state.view = hash;
    else if(validViews.includes(params.get('view'))) state.view = params.get('view');

    const wantedSource = state.source;
    const wantedUrl = state.sourceUrl;
    const cached = readCache();
    if((wantedSource==='sheet' || wantedSource==='file') && cached) restoreCache(cached);
    else loadDemoState();

    render();
    scheduleAutoRefresh();

    if(wantedSource==='sheet' && wantedUrl){
      state.source = 'sheet';
      state.sourceUrl = wantedUrl;
      state.sourceLabel = 'Google Sheets';
      updateChrome();
      loadSheet(wantedUrl, true, !!fuenteParam);
    }

    const prueba = params.get('probar');
    if(prueba==='csv'){
      const ds = parseCSV(SAMPLE_CSV);
      state.raw = {headers:ds.headers, rows:ds.rows};
      state.pendingMeta = {kind:'file', label:'CSV de ejemplo'};
      state.formSource = 'csv';
      state.mapping = savedMappingFor(ds.headers) || autoMap(ds.headers, ds.rows);
      if(params.get('destino')==='datos'){
        state.view = 'datos';
        render();
      }else{
        processDataset(ds.headers, ds.rows, {kind:'file', label:'CSV de ejemplo'}, {});
      }
    }
  }catch(err){
    console.error(err);
    showFatal(err.message || String(err));
  }
}
init();
</script>
